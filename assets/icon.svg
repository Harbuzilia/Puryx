<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Puryx brand icon: dark minimalist P monogram (Linear/Raycast-grade).
       Near-black rounded tile (#0F1115), geometric monoline letter P:
       straight stem (white) + perfectly circular bowl (cyan #22D3EE).
       Uniform 64/512 stroke, round terminals, generous margins. No gradients,
       no particles, no text. Two colors only: white + one accent. -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#0F1115"/>
  <!-- Bowl drawn beneath the stem: the cyan arc emerges from behind the white
       stem, so the stem stays continuous (no color interruptions). -->
  <path d="M 184 146 A 90 90 0 1 1 184 290" fill="none" stroke="#22D3EE" stroke-width="64" stroke-linecap="round"/>
  <path d="M 184 128 L 184 384" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round"/>
</svg>
