<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Puryx brand icon: Fluent-style rounded square, violet-indigo -> cyan gradient,
       white stylized broom swoosh forming an abstract letter P, spark and sweep particles. -->
  <defs>
    <linearGradient id="puryx-bg" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Fluent-style rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#puryx-bg)"/>

  <!-- Broom swoosh: sweeping stroke that closes into an abstract letter P -->
  <path d="M156 400 C142 320 146 232 158 168 C168 116 204 84 252 84 C310 84 348 120 348 164 C348 208 310 244 252 244 C216 244 188 228 170 200"
        fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spark thrown off by the sweep -->
  <path d="M368 318 L380 349 L411 361 L380 373 L368 404 L356 373 L325 361 L356 349 Z" fill="#FFFFFF"/>

  <!-- Sweep particles -->
  <circle cx="118" cy="432" r="14" fill="#FFFFFF"/>
  <circle cx="180" cy="454" r="10" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="230" cy="432" r="8" fill="#FFFFFF" opacity="0.7"/>
</svg>
