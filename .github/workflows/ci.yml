name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore SmartCleaner.sln
        timeout-minutes: 5

      - name: Build
        run: dotnet build SmartCleaner.sln -c Release --no-restore
        timeout-minutes: 15

      # Integration-тесты машинозависимы: помечены [Trait("Category", "Integration")]
      # (реальная FS/junction; зависимость от OEM-страницы машины — GetOEMCP).
      # Первый прогон на windows-latest (en-US, OEM cp437) это подтвердил: два
      # StartupEngine-теста с кириллическими cp866-фикстурами декодировали mojibake.
      # CI гоняет детерминированное подмножество; полный прогон с Integration — локально:
      #   dotnet test SmartCleaner.sln -c Release
      - name: Test
        run: dotnet test SmartCleaner.sln -c Release --no-build --filter Category!=Integration
        timeout-minutes: 15
