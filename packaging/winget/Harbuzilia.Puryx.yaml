# Черновик winget-манифеста Puryx v3.0.0 (singleton, схема 1.12.0)
#
# ВНИМАНИЕ: singleton-формат deprecated в microsoft/winget-pkgs — клиент winget его
# поддерживает (локальные проверки `winget validate`/`winget install --manifest`),
# но для сабмита нужен multi-file манифест. Этот файл — рабочая основа:
# финальные манифесты генерируются `wingetcreate new` или вручную по схеме 1.12.0.
#
# Перед сабмитом заменить плейсхолдеры:
#   <INSTALLER_URL> — прямой HTTPS URL ассета GitHub Release v3.0.0, например:
#     https://github.com/Harbuzilia/Puryx/releases/download/v3.0.0/SmartCleaner.App.exe
#   <SHA256> — хэш ассета: `winget hash SmartCleaner.App.exe`
# После подстановки значений кавычки вокруг URL и хэша можно снять.

PackageIdentifier: Harbuzilia.Puryx   # = путь папок manifests/h/Harbuzilia/Puryx/3.0.0/
PackageVersion: 3.0.0                 # = имя папки версии
PackageLocale: en-US                  # дефолтная локаль; ru-RU добавляется отдельным locale-файлом (multi-file)
Publisher: Harbuzilia
PackageName: Puryx
License: MIT
Moniker: puryx
ShortDescription: Smart cleanup and optimization for Windows - 16 scanners, safe deletion, NTFS Compact, privacy
Tags:
  - cleaner
  - disk-cleanup
  - optimization
  - privacy
Installers:
  - Architecture: x64
    InstallerType: portable           # одиночный exe, без установщика; silent-ключи не нужны
    InstallerUrl: "<INSTALLER_URL>"   # только HTTPS, прямая release-ссылка издателя, без редиректов
    InstallerSha256: "<SHA256>"       # обязательное поле; несовпадение = Error-Hash-Mismatch
ManifestType: singleton
ManifestVersion: 1.12.0               # PR-шаблон winget-pkgs требует соответствие схеме 1.12
